<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expenses | AALOR DISHA PUBLIC SCHOOL</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
    .topbar{background:#17385f;color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}
    .school-name{font-size:20px;font-weight:700}.topbar p{font-size:12px;margin-top:4px;opacity:.9}
    .back-btn{background:#fff;color:#17385f;text-decoration:none;padding:10px 16px;border-radius:6px;font-weight:700;font-size:13px}
    .container{max-width:1100px;margin:30px auto;padding:0 20px}
    .page-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}
    .page-head h1{color:#0c3564;margin-bottom:6px}.page-head p{color:#667085;font-size:14px}
    .add-btn,.primary{border:none;background:#17385f;color:#fff;padding:11px 17px;border-radius:8px;font-weight:700;cursor:pointer}
    .secondary{border:1px solid #cfd6df;background:#fff;color:#17385f;padding:11px 17px;border-radius:8px;font-weight:700;cursor:pointer}
    .notice{display:none;margin-bottom:16px;padding:13px 16px;border-radius:9px;font-size:14px;font-weight:600}
    .notice.success{display:block;background:#ecfdf3;color:#166534;border:1px solid #bbf7d0}
    .notice.error{display:block;background:#fff1f2;color:#b91c1c;border:1px solid #fecaca}
    .filters{background:#fff;border:1px solid #e2e7ef;border-radius:14px;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
    .field{display:flex;flex-direction:column;gap:7px}.field label{font-size:13px;font-weight:700;color:#334155}
    .field input{min-height:44px;padding:10px 12px;border:1px solid #d7dee8;border-radius:9px;font-size:14px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
    .stat{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:19px 20px;display:flex;justify-content:space-between;align-items:center}
    .stat span{font-size:13px;color:#64748b;font-weight:600}.stat strong{font-size:25px;color:#123b68}
    .table-card{background:#fff;border:1px solid #e2e7ef;border-radius:12px;overflow-x:auto}
    table{width:100%;border-collapse:collapse;min-width:650px}th{background:#f0f4f8;color:#17385f;text-align:left;padding:14px;font-size:13px}
    td{padding:13px 14px;border-top:1px solid #edf0f4;font-size:14px}.amount{font-weight:700;color:#b42318}.loading{text-align:center;padding:32px;color:#667085}
    .modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.58);z-index:50;align-items:center;justify-content:center;padding:20px}
    .modal-box{background:#fff;width:min(520px,100%);border-radius:16px;padding:24px;box-shadow:0 22px 55px rgba(0,0,0,.25)}
    .modal-box h2{color:#17385f;margin-bottom:18px}.form-grid{display:grid;gap:14px}.actions{display:flex;gap:10px;margin-top:20px}
    @media(max-width:650px){.page-head{align-items:flex-start;flex-direction:column}.filters,.stats{grid-template-columns:1fr}.add-btn{width:100%}}
  </style>
</head>
<body>
<header class="topbar">
  <div><div class="school-name">AALOR DISHA PUBLIC SCHOOL</div><p>School ERP Administration</p></div>
  <a href="admin-dashboard.html" class="back-btn">← Dashboard</a>
</header>

<main class="container">
  <section class="page-head">
    <div><h1>Expenses</h1><p>Record and review school expenses.</p></div>
    <button id="addExpenseBtn" class="add-btn">+ Add Expense</button>
  </section>

  <div id="notice" class="notice"></div>

  <section class="filters">
    <div class="field"><label for="monthFilter">Month</label><input type="month" id="monthFilter"></div>
    <div class="field"><label for="dateFilter">Specific Date (optional)</label><input type="date" id="dateFilter"></div>
  </section>

  <section class="stats">
    <div class="stat"><span>Selected Month Expenses</span><strong id="monthTotal">₹0</strong></div>
    <div class="stat"><span>This Year Expenses</span><strong id="yearTotal">₹0</strong></div>
    <div class="stat"><span>Expense Records</span><strong id="recordCount">0</strong></div>
  </section>

  <section class="table-card">
    <table>
      <thead><tr><th>#</th><th>Expense Date</th><th>Category</th><th>Details / Comment</th><th>Amount</th></tr></thead>
      <tbody id="expenseBody"><tr><td colspan="5" class="loading">Loading expenses...</td></tr></tbody>
    </table>
  </section>
</main>

<div id="expenseModal" class="modal">
  <div class="modal-box">
    <h2>Add Expense</h2>
    <form id="expenseForm">
      <div class="form-grid">
        <div class="field"><label for="expenseDate">Expense Date</label><input type="date" id="expenseDate" required></div>
        <div class="field">
          <label for="expenseCategory">Expense Category</label>
          <select id="expenseCategory" required style="min-height:44px;padding:10px 12px;border:1px solid #d7dee8;border-radius:9px;font-size:14px;background:#fff;">
            <option value="">Select Category</option>
            <option value="Stationery">Stationery</option>
            <option value="Electricity">Electricity</option>
            <option value="Maintenance">Maintenance</option>
            <option value="Transport">Transport</option>
            <option value="Cleaning">Cleaning</option>
            <option value="Internet">Internet</option>
            <option value="Event">Event</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="field"><label for="expenseAmount">Amount (₹)</label><input type="number" id="expenseAmount" min="0.01" step="0.01" placeholder="Enter amount" required></div>
        <div class="field">
          <label for="expenseDescription">Expense Details / Comment</label>
          <input type="text" id="expenseDescription" maxlength="250" placeholder="Example: Classroom cleaning materials, fan repair, notebooks...">
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="saveExpenseBtn" type="submit">Save Expense</button>
        <button class="secondary" id="cancelExpenseBtn" type="button">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://zoickuxjrwjowhotzkue.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable__i970SfH3NT8Iv_CsIYsfg_v9It3loN";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const expenseBody=document.getElementById("expenseBody");
const monthFilter=document.getElementById("monthFilter");
const dateFilter=document.getElementById("dateFilter");
const expenseModal=document.getElementById("expenseModal");
const notice=document.getElementById("notice");
let expenses=[];

function localDate(){
  const d=new Date();
  return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function money(v){return "₹"+Number(v||0).toLocaleString("en-IN",{maximumFractionDigits:2})}
function escapeHtml(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}
function prettyDate(v){
  if(!v)return "-";
  return new Date(v+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
}
function showNotice(msg,type="success"){
  notice.textContent=msg;notice.className=`notice ${type}`;
  clearTimeout(showNotice.timer);
  showNotice.timer=setTimeout(()=>{notice.className="notice";notice.textContent=""},3500);
}

monthFilter.value=localDate().slice(0,7);
document.getElementById("expenseDate").value=localDate();

async function checkAdmin(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(!session){location.href="erp-login.html";return false}
  const {data:p,error}=await supabaseClient.from("user_profiles").select("role,status").eq("user_id",session.user.id).single();
  if(error||!p||p.role!=="ADMIN"||p.status!=="Active"){
    await supabaseClient.auth.signOut();location.href="erp-login.html";return false;
  }
  return true;
}

async function loadExpenses(){
  expenseBody.innerHTML='<tr><td colspan="5" class="loading">Loading expenses...</td></tr>';
  const {data,error}=await supabaseClient.from("expenses").select("*").order("expense_date",{ascending:false});
  if(error){
    console.error("Expense load error:",error);
    expenseBody.innerHTML='<tr><td colspan="5" class="loading">Could not load expenses.</td></tr>';
    return;
  }
  expenses=data||[];
  render();
}

function render(){
  const selectedMonth=monthFilter.value;
  const selectedDate=dateFilter.value;
  const selectedYear=Number(selectedMonth.slice(0,4));

  const monthRows=expenses.filter(e=>(e.expense_date||"").slice(0,7)===selectedMonth);
  let visible=monthRows;
  if(selectedDate) visible=visible.filter(e=>e.expense_date===selectedDate);

  expenseBody.innerHTML="";
  if(!visible.length){
    expenseBody.innerHTML='<tr><td colspan="5" class="loading">No expenses found for selected period.</td></tr>';
  } else {
    visible.forEach((e,i)=>{
      const tr=document.createElement("tr");
      tr.innerHTML=`<td>${i+1}</td><td>${prettyDate(e.expense_date)}</td><td>${escapeHtml(e.expense_category || "-")}</td><td>${escapeHtml(e.description || "-")}</td><td class="amount">${money(e.amount)}</td>`;
      expenseBody.appendChild(tr);
    });
  }

  const yearRows=expenses.filter(e=>Number((e.expense_date||"").slice(0,4))===selectedYear);
  document.getElementById("monthTotal").textContent=money(monthRows.reduce((s,e)=>s+Number(e.amount||0),0));
  document.getElementById("yearTotal").textContent=money(yearRows.reduce((s,e)=>s+Number(e.amount||0),0));
  document.getElementById("recordCount").textContent=visible.length;
}

document.getElementById("addExpenseBtn").onclick=()=>expenseModal.style.display="flex";
document.getElementById("cancelExpenseBtn").onclick=()=>expenseModal.style.display="none";
expenseModal.addEventListener("click",e=>{if(e.target===expenseModal)expenseModal.style.display="none"});

document.getElementById("expenseForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const amount=Number(document.getElementById("expenseAmount").value);
  const expense_date=document.getElementById("expenseDate").value;
  const expense_category=document.getElementById("expenseCategory").value;
  const description=document.getElementById("expenseDescription").value.trim() || null;

  if(!expense_date||!expense_category||!amount||amount<=0){
    showNotice("Please select category and enter a valid date and amount.","error");
    return;
  }

  const btn=document.getElementById("saveExpenseBtn");
  btn.disabled=true;btn.textContent="Saving...";

  const {error}=await supabaseClient.from("expenses").insert([{expense_date,expense_category,description,amount}]);

  btn.disabled=false;btn.textContent="Save Expense";

  if(error){
    console.error("Expense insert error:",error);
    showNotice("Expense could not be saved. Please try again.","error");
    return;
  }

  document.getElementById("expenseForm").reset();
  document.getElementById("expenseDate").value=localDate();
  expenseModal.style.display="none";
  showNotice("Expense saved successfully.");
  await loadExpenses();
});

monthFilter.addEventListener("change",render);
dateFilter.addEventListener("change",render);

(async()=>{
  if(!await checkAdmin())return;
  await loadExpenses();
})();
</script>
</body>
</html>
